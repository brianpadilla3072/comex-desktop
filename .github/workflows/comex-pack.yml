name: Comex pack

on:
  push:
    paths:
      - 'pack/**'
      - '.github/workflows/comex-pack.yml'
  pull_request:
    paths:
      - 'pack/**'
      - '.github/workflows/comex-pack.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar herramientas y asistentes
        run: python pack/scripts/validar.py
