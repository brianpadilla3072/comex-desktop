directories:
  output: dist-electron
toolsets:
  appimage: "1.0.3"
files:
  - electron/**/*
  - server/**/*
  # The server's module graph statically imports the plugin JS, so those files
  # must live inside the asar. electron-builder 26.18 does not honour a
  # `!dir/*.wasm` negation for a nested directory (it prunes the whole folder),
  # so the folder is excluded from the recursive glob and re-included explicitly
  # as JS-only with the object form already proven for node_modules. The wasm
  # blobs stay in extraResources for the engine, which cannot read asar paths.
  - "!server/dist/opencode-plugins/**"
  - from: server/dist/opencode-plugins
    to: server/dist/opencode-plugins
    filter:
      - "**/*.js"
  - package.json
  - from: .electron-runtime/node_modules
    to: node_modules
extraResources:
  - from: ../../pack
    to: pack
    filter:
      - "**/*"
      - "!**/__pycache__/**"
  - from: .electron-runtime/openwork-sentry.json
    to: openwork-sentry.json
  - from: ../app/dist
    to: app-dist
  - from: server/dist/opencode-plugins
    to: opencode-plugins
    filter:
      - "*.js"
      - "*.wasm"
  - from: ../../packages/docs
    to: openwork-docs
    filter:
      - "**/*.md"
      - "**/*.mdx"
      - "docs.json"
asar: true
asarUnpack:
  # Keep Windows native code outside ASAR so it can be signed and audited.
  - "**/*.exe"
  - "**/*.dll"
  - "**/*.node"
  # External tar cannot read an archive through Electron's virtual ASAR paths.
  - server/dist/opencode-plugin-deps-*.tgz
  - node_modules/.pnpm/@lydell+node-pty*/**
  - node_modules/node-pty/**
  # Blender loads computer use's script bridge from a real file.
  - electron/computer-scripting/**
npmRebuild: false
afterPack: scripts/electron-after-pack.cjs
afterSign: scripts/electron-after-sign.cjs
publish:
  - provider: github
    owner: brianpadilla3072
    repo: comex-desktop
    releaseType: release
mac:
  icon: resources/icons/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: OpenWork uses the microphone when you allow a page to access audio input.
    NSAppleEventsUsageDescription: OpenWork controls this app with a script when you approve a computer use task.
    NSSpeechRecognitionUsageDescription: OpenWork turns your speech into text on this Mac when you dictate a message.
  extraResources:
    - from: ../../pack
      to: pack
      filter:
        - "**/*"
        - "!**/__pycache__/**"
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode
        - opencode2
        - opencode-aarch64-apple-darwin
        - opencode2-aarch64-apple-darwin
        - opencode-x86_64-apple-darwin
        - opencode2-x86_64-apple-darwin
        - versions.json
        - versions.json-aarch64-apple-darwin
        - versions.json-x86_64-apple-darwin
    - from: resources/helpers
      to: helpers
      filter:
        - "OpenWork Computer Use.app/**"
        - openwork-dictation
  target:
    - dmg
    - zip
linux:
  icon: resources/icons/linux
  syncDesktopName: true
  extraResources:
    - from: vendor/comex-python
      to: comex-python
      filter:
        - "**/*"
        - "!**/__pycache__/**"
    - from: ../../pack
      to: pack
      filter:
        - "**/*"
        - "!**/__pycache__/**"
    - from: resources/icons/linux
      to: icons/linux
      filter:
        - "*.png"
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode
        - opencode2
        - opencode-aarch64-unknown-linux-gnu
        - opencode2-aarch64-unknown-linux-gnu
        - opencode-x86_64-unknown-linux-gnu
        - opencode2-x86_64-unknown-linux-gnu
        - versions.json
        - versions.json-aarch64-unknown-linux-gnu
        - versions.json-x86_64-unknown-linux-gnu
  target:
    - AppImage
    - tar.gz
win:
  icon: resources/icons/icon.ico
  signExts: [".dll", ".node"]
  signtoolOptions:
    sign: scripts/windows-sign.cjs
    signingHashAlgorithms: [sha256]
  extraResources:
    - from: vendor/comex-python
      to: comex-python
      filter:
        - "**/*"
        - "!**/__pycache__/**"
    - from: ../../pack
      to: pack
      filter:
        - "**/*"
        - "!**/__pycache__/**"
    - from: resources/icons/icon.png
      to: icons/icon.png
    - from: resources/helpers
      to: helpers
      filter:
        - openwork-dictation.exe
        - openwork-computer-use.exe
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode.exe
        - opencode2.exe
        - opencode-aarch64-pc-windows-msvc.exe
        - opencode2-aarch64-pc-windows-msvc.exe
        - opencode-x86_64-pc-windows-msvc.exe
        - opencode2-x86_64-pc-windows-msvc.exe
        - versions.json
        - versions.json-aarch64-pc-windows-msvc
        - versions.json-x86_64-pc-windows-msvc
  target:
    - nsis
nsis:
  include: build/installer.nsh
