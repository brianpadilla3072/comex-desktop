<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f19" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OpenWork" />
    <title>OpenWork</title>

    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" type="image/svg+xml" href="/openwork-mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("openwork.themePref") || "system";
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved = mode === "dark" || (mode === "system" && prefersDark) ? "dark" : "light";
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
    <script>
      // Pre-boot error beacon for web deployments: reports a web instance
      // that fails to load (entry bundle error, early exception) to Sentry
      // before the app's own error monitoring can start. Inert unless the
      // build sets VITE_OPENWORK_DEPLOYMENT=web and VITE_OPENWORK_SENTRY_DSN.
      // Once src/app/lib/error-monitoring.ts starts, it takes over via
      // window.__openworkWebErrorMonitorActive.
      (function () {
        try {
          var dsn = "%VITE_OPENWORK_SENTRY_DSN%";
          var deployment = "%VITE_OPENWORK_DEPLOYMENT%";
          if (deployment !== "web" || !dsn || dsn.charAt(0) === "%") return;
          var match = dsn.match(/^https:\/\/([\w.-]+)@([\w.-]+(?::\d+)?)\/(\d+)$/);
          if (!match) return;
          var envelopeUrl =
            "https://" + match[2] + "/api/" + match[3] +
            "/envelope/?sentry_key=" + match[1] + "&sentry_version=7";
          var sent = 0;
          function analyticsAllowed() {
            try {
              var raw = localStorage.getItem("openwork.preferences");
              if (!raw) return true;
              return JSON.parse(raw).analyticsEnabled !== false;
            } catch (e) {
              return true;
            }
          }
          function send(type, message) {
            if (sent >= 3 || window.__openworkWebErrorMonitorActive === true) return;
            if (!analyticsAllowed()) return;
            sent += 1;
            var id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())).replace(/-/g, "");
            var event = {
              event_id: id,
              timestamp: Date.now() / 1000,
              platform: "javascript",
              level: "error",
              environment: "web",
              tags: { boot_phase: "boot" },
              // Origin + path only: sign-in and deep-link URLs can carry
              // credentials in the query string that must never leave the page.
              request: { url: location.origin + location.pathname },
              exception: { values: [{ type: type, value: String(message).slice(0, 1000) }] },
            };
            var body =
              JSON.stringify({ event_id: id, sent_at: new Date().toISOString() }) +
              "\n" + JSON.stringify({ type: "event" }) +
              "\n" + JSON.stringify(event);
            try {
              fetch(envelopeUrl, { method: "POST", body: body, keepalive: true })["catch"](function () {});
            } catch (e) {}
          }
          window.addEventListener(
            "error",
            function (e) {
              var t = e.target;
              var src = t && (t.tagName === "SCRIPT" ? t.src : t.tagName === "LINK" ? t.href : "");
              if (src) {
                send("WebBootLoadFailure", "failed to load " + String(src).split("?")[0].split("#")[0]);
                return;
              }
              if (e.message) send("WebBootError", e.message);
            },
            true
          );
          window.addEventListener("unhandledrejection", function (e) {
            var reason = e.reason;
            send("WebBootRejection", reason && reason.message ? reason.message : reason);
          });
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-dls-surface text-dls-text mac:bg-transparent">
    <div id="root">
      <!-- Visible even when the entry bundle cannot load. React replaces this on mount. -->
      <div id="startup-screen" data-reveal-after-ms="12000" style="min-height: 100dvh; display: flex; align-items: center; justify-content: center; font: 14px system-ui; text-align: center; padding: 24px; box-sizing: border-box">
        <div>
          <p id="startup-status" role="status">Starting OpenWork</p>
          <div id="startup-recovery" hidden>
            <p id="startup-recovery-message" role="alert">OpenWork is taking longer than usual to start.</p>
            <button id="startup-reload" type="button" onclick="window.location.reload()" style="font: inherit; padding: 8px 16px; cursor: pointer">Reload</button>
          </div>
        </div>
      </div>
    </div>
    <script id="startup-screen-script">
      // Startup screen before React mounts (feature startupScreenPolish,
      // docs/features/startup-screen-polish). No framework, no network: the
      // flag comes from the last value the app saved (only "off" is stored).
      // React replaces #startup-screen on mount, which ends everything here.
      (function () {
        var STRINGS = {
          en: {
            status: "Starting OpenWork",
            slow: "OpenWork is taking longer than usual to start.",
            failed: "OpenWork could not load. Reload to try again.",
            reload: "Reload",
          },
          es: {
            status: "Iniciando OpenWork",
            slow: "OpenWork está tardando más de lo normal en iniciar.",
            failed: "OpenWork no pudo cargar. Recarga para intentarlo de nuevo.",
            reload: "Recargar",
          },
        };
        var LANGUAGES = ["en", "ja", "zh", "vi", "pt-BR", "th", "fr", "ca", "es", "ru"];
        function read(key) {
          try {
            return localStorage.getItem(key);
          } catch (e) {
            return null;
          }
        }
        function strings(code) {
          var base = String(code || "").toLowerCase().split("-")[0];
          return base === "es" ? STRINGS.es : STRINGS.en;
        }
        function language() {
          var saved = read("openwork.language");
          if (LANGUAGES.indexOf(saved) !== -1) return saved;
          var hint = read("openwork.language.default");
          if (LANGUAGES.indexOf(hint) !== -1) return hint;
          return (navigator.languages && navigator.languages[0]) || navigator.language || "en";
        }
        function el(id) {
          return document.getElementById(id);
        }
        function mounted() {
          return !el("startup-screen");
        }
        var polish = read("openwork.startupScreenPolish") !== "off";
        var text = polish ? strings(language()) : STRINGS.en;
        var revealed = false;
        function reveal(failed) {
          if (mounted()) return;
          var recovery = el("startup-recovery");
          var message = el("startup-recovery-message");
          if (failed && message) message.textContent = text.failed;
          if (recovery) recovery.hidden = false;
          revealed = true;
        }
        if (!polish) {
          setTimeout(function () { reveal(false); }, 45000);
          return;
        }
        if (el("startup-status")) el("startup-status").textContent = text.status;
        if (el("startup-recovery-message")) el("startup-recovery-message").textContent = text.slow;
        if (el("startup-reload")) el("startup-reload").textContent = text.reload;
        var screen = el("startup-screen");
        var delay = Number(screen && screen.getAttribute("data-reveal-after-ms")) || 12000;
        setTimeout(function () { if (!revealed) reveal(false); }, delay);
        // Capture phase: a script's load error does not bubble to window.
        window.addEventListener(
          "error",
          function (event) {
            var target = event.target;
            if (target && target.tagName === "SCRIPT") {
              if (target.type === "module") reveal(true);
              return;
            }
            if (target === window || !target || !target.tagName) reveal(true);
          },
          true
        );
      })();
    </script>
    <script type="module" src="/src/index.react.tsx"></script>
  </body>
</html>
