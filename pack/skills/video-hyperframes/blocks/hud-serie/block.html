<div class="cam" style="z-index: 4">
  <div class="world">
    <div class="blk-hud">
      <div class="blk-hud__day">DÍA {{day}} / {{total}}</div>

      <div class="blk-hud__right">
        <div class="blk-hud__clock">+00:00</div>
        <div class="blk-hud__tag">{{tag}}</div>
      </div>

      <div class="blk-hud__bar">
        <div class="blk-hud__label">{{label}}</div>
        <div class="blk-hud__track"><div class="blk-hud__fill"></div></div>
        <div class="blk-hud__pct">0%</div>
      </div>
    </div>
  </div>
</div>
