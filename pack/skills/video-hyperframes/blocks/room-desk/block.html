<div class="blk-room" data-time="{{time}}" data-monitor="{{monitor}}">
  <svg class="blk-room__svg" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="1080" height="1300" fill="var(--wall)" />
    <rect x="0" y="1300" width="1080" height="620" fill="var(--floor)" />
    <rect x="0" y="1280" width="1080" height="24" fill="rgba(0,0,0,0.18)" />

    <g class="blk-room__window">
      <rect x="628" y="268" width="360" height="440" rx="14" fill="var(--window-frame)" />
      <rect x="648" y="288" width="320" height="400" rx="8" fill="var(--sky)" />
      <circle class="blk-room__sun" cx="880" cy="600" r="64" fill="var(--sun)" />
      <line x1="808" y1="288" x2="808" y2="688" stroke="var(--window-frame)" stroke-width="14" />
      <line x1="648" y1="488" x2="968" y2="488" stroke="var(--window-frame)" stroke-width="14" />
    </g>

    <g class="blk-room__monitor">
      <ellipse cx="540" cy="1108" rx="150" ry="16" fill="rgba(0,0,0,0.28)" />
      <rect x="512" y="1044" width="56" height="66" fill="var(--monitor-stand)" />
      <rect x="300" y="700" width="480" height="350" rx="18" fill="var(--monitor-frame)" />
      <rect x="318" y="718" width="444" height="314" rx="10" fill="var(--monitor-screen)" />
      <g class="blk-room__screen-ui">
        <rect x="342" y="748" width="240" height="18" rx="9" fill="var(--screen-line)" />
        <rect x="342" y="786" width="360" height="14" rx="7" fill="var(--screen-line-soft)" />
        <rect x="342" y="814" width="300" height="14" rx="7" fill="var(--screen-line-soft)" />
        <rect x="342" y="880" width="120" height="120" rx="12" fill="var(--screen-block)" />
        <rect x="486" y="880" width="120" height="120" rx="12" fill="var(--screen-block)" />
      </g>
    </g>
  </svg>
</div>
