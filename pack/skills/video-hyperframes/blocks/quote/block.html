<div class="cam" style="z-index: 1">
  <div class="world">
    <div class="blk-quote">
      <div class="blk-quote__mark" aria-hidden="true">&#8220;</div>
      <div class="blk-quote__body">
        <div class="blk-quote__text">&#8220;{{text}}&#8221;</div>
        <div class="blk-quote__author">
          <span class="blk-quote__bar"></span>

            <span class="blk-quote__name">{{author}}</span>
            <span class="blk-quote__role">{{role}}</span>
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
