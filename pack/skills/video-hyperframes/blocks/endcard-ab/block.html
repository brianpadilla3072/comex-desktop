<div class="cam" style="z-index: 3">
  <div class="world">
    <div class="blk-ec">
      <div class="blk-ec__kicker">{{kicker}}</div>

      <div class="blk-ec__row">
        <div class="blk-ec__card blk-ec__card--a">
          <div class="blk-ec__letter">A</div>
          <div class="blk-ec__label">{{optionA}}</div>
        </div>
        <div class="blk-ec__card blk-ec__card--b">
          <div class="blk-ec__letter">B</div>
          <div class="blk-ec__label">{{optionB}}</div>
        </div>
      </div>

      <div class="blk-ec__cta">{{cta}}</div>
    </div>
  </div>
</div>
