<div class="cam" style="z-index: 2">
  <div class="world">
    <div class="blk-stand" data-state="{{state}}" data-dir="{{dir}}">
      <svg class="blk-stand__svg" viewBox="0 0 420 900" xmlns="http://www.w3.org/2000/svg">
        <g id="stand-move">
          <g id="stand" transform="translate(210, 880)">
            <ellipse cx="0" cy="6" rx="118" ry="18" fill="rgba(0,0,0,0.4)" />

            <g id="stand-leg-l-move">
              <g id="stand-leg-l" transform="translate(-34, -330)">
                <rect x="-20" y="0" width="42" height="300" rx="21" fill="var(--pants)" />
                <rect x="-28" y="286" width="66" height="30" rx="15" fill="var(--shoe)" />
              </g>
            </g>
            <g id="stand-leg-r-move">
              <g id="stand-leg-r" transform="translate(34, -330)">
                <rect x="-22" y="0" width="42" height="300" rx="21" fill="var(--pants)" />
                <rect x="-38" y="286" width="66" height="30" rx="15" fill="var(--shoe)" />
              </g>
            </g>

            <g id="stand-body-move">
              <g id="stand-body" transform="translate(0, -330)">
                <rect x="-96" y="-310" width="192" height="320" rx="52" fill="var(--hoodie)" />
                <rect x="-96" y="-310" width="192" height="46" rx="22" fill="rgba(0,0,0,0.18)" />
                <rect x="-34" y="-20" width="68" height="12" rx="6" fill="rgba(0,0,0,0.18)" />

                <g id="stand-arm-l-move">
                  <g id="stand-arm-l" transform="translate(-96, -286)">
                    <rect x="-24" y="0" width="36" height="250" rx="18" fill="var(--hoodie)" />
                    <circle cx="-6" cy="252" r="21" fill="var(--skin)" />
                  </g>
                </g>
                <g id="stand-arm-r-move">
                  <g id="stand-arm-r" transform="translate(96, -286)">
                    <rect x="-12" y="0" width="36" height="250" rx="18" fill="var(--hoodie)" />
                    <circle cx="6" cy="252" r="21" fill="var(--skin)" />
                  </g>
                </g>

                <g id="stand-head" transform="translate(0, -330)">
                  <rect x="-24" y="0" width="48" height="38" fill="var(--skin)" />
                  <circle cx="0" cy="-62" r="94" fill="var(--hair)" />
                  <circle cx="-14" cy="-58" r="70" fill="var(--hair-light)" opacity="0.22" />
                  <path d="M-104 -66 A104 104 0 0 1 104 -66" fill="none"
                    stroke="var(--accent)" stroke-width="14" stroke-linecap="round" />
                  <rect x="-122" y="-78" width="30" height="60" rx="15" fill="var(--accent)" />
                  <rect x="92" y="-78" width="30" height="60" rx="15" fill="var(--accent)" />
                </g>
              </g>
            </g>

            <g id="stand-bag-l-move">
              <g id="stand-bag-l" transform="translate(-124, -300)">
                <path d="M-28 -76 Q0 -104 28 -76" fill="none" stroke="var(--bag-handle)" stroke-width="10" />
                <rect x="-54" y="-78" width="108" height="132" rx="12" fill="var(--bag-1)" />
                <rect x="-54" y="-78" width="108" height="26" rx="10" fill="rgba(0,0,0,0.18)" />
                <rect x="-34" y="-42" width="68" height="10" rx="5" fill="rgba(255,255,255,0.35)" />
              </g>
            </g>
            <g id="stand-bag-r-move">
              <g id="stand-bag-r" transform="translate(124, -300)">
                <path d="M-28 -76 Q0 -104 28 -76" fill="none" stroke="var(--bag-handle)" stroke-width="10" />
                <rect x="-54" y="-78" width="108" height="132" rx="12" fill="var(--bag-2)" />
                <rect x="-54" y="-78" width="108" height="26" rx="10" fill="rgba(0,0,0,0.18)" />
                <rect x="-34" y="-42" width="68" height="10" rx="5" fill="rgba(255,255,255,0.35)" />
              </g>
            </g>
          </g>
        </g>
      </svg>
    </div>
  </div>
</div>
