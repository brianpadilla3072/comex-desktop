<div class="cam">
  <div class="world">
    <div class="blk-win">
      <div class="blk-win__bar">
        <span class="blk-win__dot"></span>
        <span class="blk-win__title">{{title}}</span>
        <span class="blk-win__btns">– □ ×</span>
      </div>
      <div class="blk-win__menu">{{menu}}</div>
      <div class="blk-win__body">
        <!-- each:rows -->
        <div class="blk-win__row">
          <span class="blk-win__name">{{name}}</span>
          <span class="blk-win__value">{{value}}</span>
          <span class="blk-win__state">{{state}}</span>
        </div>
        <!-- /each:rows -->
      </div>
    </div>
  </div>
</div>
