<div class="cam">
  <div class="world">
    <div class="blk-bars">
      <div class="blk-bars__title">{{title}}</div>
      <!-- each:items -->
      <div class="blk-bars__row">
        <span class="blk-bars__label">{{label}}</span>
        <span class="blk-bars__track">
          <span class="blk-bars__fill" style="width: {{value}}%"></span>
        </span>
        <span class="blk-bars__value">{{value}}{{unit}}</span>
      </div>
      <!-- /each:items -->
    </div>
  </div>
</div>
